[package]
name = "rust-core"
version = "0.1.0"
edition = "2021"
description = "High-performance core components for the ablation machine"

[lib]
name = "rust_core"
crate-type = ["cdylib", "rlib"]

[dependencies]
# Python bindings
pyo3 = { version = "0.20", features = ["extension-module"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Math and tensors (using ndarray for now, can switch to tch-rs for PyTorch)
ndarray = "0.15"
ndarray-rand = "0.14"

# Random number generation
rand = "0.8"
rand_distr = "0.4"

# Hashing for tokenizers
fxhash = "0.2"

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = "0.3"

[features]
default = []
cuda = []
